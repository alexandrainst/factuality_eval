defaults:
  - override hydra/job_logging: custom
  - _self_

base_dataset:
  id: multi-wiki-qa
  organisation: alexandrainst
  split: train
  context_key: context
  question_key: question
  answer_key: answers
  squad_format: true

beta_distribution:
  mean: 0.2
  std: 0.15

hub_organisation: alexandrainst
private: true

testing: false

max_workers: 8

save_dataset_to_file: false

training:
  output_dir: models
  batch_size: 16
  epochs: 5
  learning_rate: 1e-5
  weight_decay: 0.01
  push_to_hub: False
  max_length: 8192
  device: auto  # auto/cuda/cpu

models:
  hallu_detect_model: mmBERT-small
  pretrained_model: jhu-clsp/mmBERT-small
  eval_model: Qwen/Qwen3-0.6B
  hallu_gen_model: gpt-5-mini
  # Optional reasoning effort for OpenAI reasoning-capable models.
  # Examples: low, medium, high. Null means API default.
  hallu_gen_reasoning_effort: low

language: da

generation:
  max_examples: 1000
  max_new_tokens: 8192
  temperature: 0.0
  top_p: 1.0
  top_k: 0


eval_dataset:
  id: EuroEval/ragtruth-translated-hallucinations-da-mini
  split: test
  prompt_key: prompt
  answer_key: answer

ragtruth:
  id: alexandrainst/ragtruth-translated-hallucinations
  enable: true

multiwikiqa:
  enable: true

manual_annotation:
  dataset_path: data/final/ground_truth_evaluation_dataset.jsonl
  detector_model_dir: null   # null = auto-resolve from models/ then HF Hub
  port_from_backup: true
  language: da
  n_samples_target: 100
  ragtruth:
    enable: true
    path: data/processed/ragtruth_${language}/ragtruth_data_${language}.json
    splits: [test]
    task_types: [QA]
    n_samples: 100
    seed: 42
    # When true, populate human_hallucinated_parts / human_annotation_status
    # from the RAGTruth gold labels so the rows count as annotated immediately.
    preload_human_annotations: true
